defaults:
  - baseline
  - override model: conformer_rnnt
  - override writer: cometml
  - override metrics: rnnt
  - override datasets: onebatchtest
  - override transforms: log_mel
  - _self_

model:
  dropout: 0.0

text_encoder:
  _target_: src.text_encoder.BPETextEncoder
  model_path: resources/tokenizers/bpe_256.model

loss_function:
  _target_: src.loss.RNNTLossWrapper
  blank_id: 0
  reduction: mean

# The same two training recordings are used to check memorization.
datasets:
  train:
    part: train-clean-100
    max_audio_length: 6.0
    max_text_length: 100
  val:
    part: train-clean-100
    max_audio_length: 6.0
    max_text_length: 100

dataloader:
  batch_size: 2
  num_workers: 0

optimizer:
  lr: 3e-4
  weight_decay: 0.0

lr_scheduler: ${onebatch_scheduler}
onebatch_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  factor: 1.0
  total_iters: 1

trainer:
  encoder_checkpoint: saved/conformer_bpe_ls960_night_b16_108k_cosine_lr1e5_v1/model_best.pth
  from_pretrained: null
  resume_from: null
  n_epochs: 20
  epoch_len: 50
  log_step: 50
  max_grad_norm: 5
  skip_oom: false
  monitor: "min val_WER_(Greedy)"
  save_period: 5

writer:
  workspace: alex-markotenko
  project_name: dla-1
  run_name: conformer_rnnt_bpe256_onebatch_v1
  mode: online
  log_checkpoints: false
