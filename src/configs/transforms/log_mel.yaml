instance_transforms:
  train: ${transforms.instance_transforms.inference}
  inference:
    get_spectrogram:
      _target_: torchvision.transforms.v2.Compose
      transforms:
        - _target_: torchaudio.transforms.MelSpectrogram
          sample_rate: 16000
          n_fft: 1024
          win_length: 400
          hop_length: 160
          n_mels: ${model.n_feats}
          power: 2.0
        - _target_: torchaudio.transforms.AmplitudeToDB
          stype: power
          top_db: 80

batch_transforms:
  train: null
  inference: null
