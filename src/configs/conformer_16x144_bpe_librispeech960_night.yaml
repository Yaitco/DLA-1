defaults:
  - conformer_16x144_bpe_librispeech960
  - _self_

optimizer:
  lr: 1e-5
  weight_decay: 0.01

# Interpolation replaces all inherited OneCycle arguments.
lr_scheduler: ${night_scheduler}

night_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 108000
  eta_min: 1e-7

trainer:
  from_pretrained: saved/conformer_bpe_ls960_specaug_b16_50k_v1/model_best.pth
  resume_from: null
  n_epochs: 108
  epoch_len: 1000
  save_period: 5

writer:
  run_name: conformer_bpe_ls960_night_b16_108k_cosine_lr1e5_v1
  log_checkpoints: false
